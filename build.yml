name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          flutter create --platforms=android --project-name shorts_app --org com.example app
          cp main.dart app/lib/main.dart
          cp AndroidManifest.xml app/android/app/src/main/AndroidManifest.xml
          cd app
          flutter pub add video_player photo_manager dio path_provider gal webview_flutter
          sed -i 's/flutter.minSdkVersion/24/' android/app/build.gradle*
          if [ -f ../icon.png ]; then
            flutter pub add dev:flutter_launcher_icons
            cp ../icon.png icon.png
            printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "icon.png"\n' > flutter_launcher_icons.yaml
            dart run flutter_launcher_icons
          fi
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: shorts-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
